<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Content Overview</title>
  <link rel="stylesheet" href="../../../../../../../tokens/tokens.css">
  <link rel="stylesheet" href="s3-screen.css">
</head>
<body>
  <nav class="nav" data-component="Nav / Navigation">Analytics</nav>
  <header class="topbar" data-component="Nav / App TopBar">Content Overview</header>
  <main class="main">
    <div class="filter-bar">
      <div class="segment" aria-selected="true" data-component="Controls / Segmented Control">Content</div>
      <div class="filter" data-component="Controls / Filter / Select">30일</div>
    </div>
    <a class="cta-link">Export</a>
    <div class="empty-slot">Add</div>
    <div class="popover">Help</div>
    <section class="section" data-section="content" id="actual">
      <h2>Top performers</h2>
      <article class="actual-card" data-kind="actual"><span class="label">Actual</span> Reel A</article>
    </section>
    <section class="section" data-section="content" id="forecast">
      <h2>Top forecast performers</h2>
      <article class="forecast-card" data-kind="forecast"><span class="badge">Forecast</span> Reel B</article>
    </section>
  </main>
</body>
</html>
